<text x="908" y="772" class="field">analysis.MonthlyAIAnalysis</text>
<text x="908" y="794" class="field">FK user, year, month</text>
<text x="908" y="816" class="field">total/log/average</text>
<text x="908" y="838" class="field">category_summary</text>
<text x="908" y="860" class="field">summary/feedback</text>
<text x="908" y="882" class="field">risk_level</text>
<rect x="1240" y="245" width="255" height="165" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1258" y="285" class="entity-title">FinancialProduct</text>
<text x="1258" y="317" class="field">finance.FinancialProduct</text>
<text x="1258" y="339" class="field">deposit or saving</text>
<text x="1258" y="361" class="field">product code, bank</text>
<text x="1258" y="383" class="field">product name</text>
<text x="1258" y="405" class="field">is_active</text>
<rect x="1550" y="245" width="255" height="170" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1568" y="285" class="entity-title">ProductOption</text>
<text x="1568" y="317" class="field">finance.ProductOption</text>
<text x="1568" y="339" class="field">FK product</text>
<text x="1568" y="361" class="field">save_trm months</text>
<text x="1568" y="383" class="field">base/max rates</text>
<text x="1568" y="405" class="field">unique option terms</text>
<rect x="1550" y="485" width="255" height="155" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1568" y="525" class="entity-title">UserProduct</text>
<text x="1568" y="557" class="field">finance.UserFinancialProduct</text>
<text x="1568" y="579" class="field">FK user, FK option</text>
<text x="1568" y="601" class="field">active or cancelled</text>
<text x="1568" y="623" class="field">joined/cancelled at</text>
<rect x="1240" y="705" width="285" height="195" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1258" y="745" class="entity-title">Recommendation</text>
<text x="1258" y="777" class="field">finance.Recommendation</text>
<text x="1258" y="799" class="field">FK user</text>
<text x="1258" y="821" class="field">FK analysis/product/option</text>
<text x="1258" y="843" class="field">reason + action</text>
<text x="1258" y="865" class="field">product snapshot</text>
<rect x="1550" y="735" width="255" height="165" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1568" y="775" class="entity-title">StockHolding</text>
<text x="1568" y="807" class="field">finance.StockHolding</text>
<text x="1568" y="829" class="field">FK user</text>
<text x="1568" y="851" class="field">symbol, quantity</text>
<text x="1568" y="873" class="field">avg/current price</text>
<text x="1568" y="895" class="field">unique(user, symbol)</text>
<rect x="1240" y="975" width="255" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1258" y="1015" class="entity-title">Commodity</text>
<text x="1258" y="1047" class="field">finance.Commodity</text>
<text x="1258" y="1069" class="field">GOLD or SILVER</text>
<text x="1258" y="1091" class="field">name, unit, currency</text>
<rect x="1550" y="955" width="255" height="155" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="1568" y="995" class="entity-title">CommodityPrice</text>
<text x="1568" y="1027" class="field">finance.CommodityPrice</text>
<text x="1568" y="1049" class="field">FK commodity</text>
<text x="1568" y="1071" class="field">price_date</text>
<text x="1568" y="1093" class="field">OHLC prices</text>
<text x="1568" y="1115" class="field">unique(asset, date)</text>
<rect x="70" y="850" width="460" height="145" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="88" y="888" class="entity-title">User-scoped tables</text>
<text x="88" y="920" class="field">ExpenseLog, Like, Comment, MonthlyAnalysis, AIAnalysis,</text>
<text x="88" y="943" class="field">UserProduct, Recommendation, StockHolding, Notification</text>
<text x="88" y="966" class="field">all have FK user and are filtered by request.user.</text>
<rect x="610" y="950" width="530" height="125" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="628" y="988" class="entity-title">Visibility policy</text>
<text x="628" y="1020" class="field">Feed = accepted friends + visibility + is_visible + expires_at.</text>
<text x="628" y="1043" class="field">Own expense list keeps records even after expiration.</text>
<text x="628" y="1066" class="field">Dashed lines are data-flow/derivation, not direct FK.</text>
<rect x="1220" y="1145" width="600" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="1238" y="1183" class="entity-title">External API boundary</text>
<text x="1238" y="1215" class="field">FinLife seeds products, GMS creates analysis, Kiwoom serves quote/chart.</text>
<text x="1238" y="1238" class="field">YouTube and Kakao are read-through APIs without core persistence.</text>
</svg>