<rect x="170" y="245" width="250" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="188" y="285" class="entity-title">User</text>
<text x="188" y="317" class="field">accounts.User</text>
<text x="188" y="339" class="field">email unique</text>
<text x="188" y="361" class="field">root owner</text>
<rect x="80" y="430" width="200" height="125" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="98" y="470" class="entity-title">Profile</text>
<text x="98" y="502" class="field">profiles.Profile</text>
<text x="98" y="524" class="field">OneToOne user</text>
<text x="98" y="546" class="field">nickname, image, bio</text>
<rect x="310" y="430" width="210" height="135" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="328" y="470" class="entity-title">Friend</text>
<text x="328" y="502" class="field">friends.Friend</text>
<text x="328" y="524" class="field">user + friend</text>
<text x="328" y="546" class="field">pending/accepted/rejected</text>
<text x="328" y="568" class="field">no duplicate pair</text>
<rect x="150" y="635" width="290" height="145" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="168" y="675" class="entity-title">Notification</text>
<text x="168" y="707" class="field">notifications.Notification</text>
<text x="168" y="729" class="field">receiver user + actor</text>
<text x="168" y="751" class="field">type/title/message</text>
<text x="168" y="773" class="field">target route data</text>
<rect x="630" y="245" width="210" height="115" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="648" y="285" class="entity-title">Category</text>
<text x="648" y="317" class="field">expenses.Category</text>
<text x="648" y="339" class="field">name unique</text>
<text x="648" y="361" class="field">used by logs</text>
<rect x="890" y="230" width="230" height="190" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="908" y="270" class="entity-title">ExpenseLog</text>
<text x="908" y="302" class="field">expenses.ExpenseLog</text>
<text x="908" y="324" class="field">FK user, FK category</text>
<text x="908" y="346" class="field">amount, media, content</text>
<text x="908" y="368" class="field">visibility, hide_amount</text>
<text x="908" y="390" class="field">expires_at, is_visible</text>
<rect x="630" y="475" width="210" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="648" y="515" class="entity-title">Like</text>
<text x="648" y="547" class="field">expenses.Like</text>
<text x="648" y="569" class="field">FK user, FK log</text>
<text x="648" y="591" class="field">unique(user, log)</text>
<rect x="890" y="475" width="230" height="125" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="908" y="515" class="entity-title">Comment</text>
<text x="908" y="547" class="field">expenses.Comment</text>
<text x="908" y="569" class="field">FK user, FK log</text>
<text x="908" y="591" class="field">content, timestamps</text>
